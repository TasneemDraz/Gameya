# Local stack: docker compose up --build -d   (API on http://localhost:8080, Mailpit UI on http://localhost:8025)
# Dev passwords below are the same ones docker/postgres/init.sql sets; nothing here is for production.
x-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gameya
      POSTGRES_PASSWORD: postgres-superuser-dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gameya"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *json-file-logging

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    logging: *json-file-logging

  api:
    image: gameya-api:dev
    build:
      context: .
      dockerfile: src/Gameya.Api/Dockerfile
    # Applies EF migrations as gameya_migrator, then keeps serving. The flag is refused outside Development.
    command: ["--migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__App: Host=postgres;Port=5432;Database=gameya;Username=gameya_app;Password=gameya_app_dev
      ConnectionStrings__Migrator: Host=postgres;Port=5432;Database=gameya;Username=gameya_migrator;Password=gameya_migrator_dev
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Sms__Provider: Logging
      Storage__RootPath: /data/files
    ports:
      - "8080:8080"
    volumes:
      - files:/data/files
    logging: *json-file-logging

volumes:
  pgdata:
  files:
