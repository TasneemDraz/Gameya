name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Gameya.sln
      - run: dotnet build Gameya.sln --no-restore -warnaserror
      - run: dotnet format Gameya.sln --no-restore --verify-no-changes
      - name: Test
        run: >
          dotnet test Gameya.sln --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trx-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/gameya-web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: src/gameya-web
      - run: npm --prefix src/gameya-web run lint
      - run: npx stylelint "src/**/*.scss"
        working-directory: src/gameya-web
      - run: node tools/check-i18n.mjs
      - run: node --test "tools/*.test.mjs"
      - run: npm --prefix src/gameya-web test -- --watch=false
      - run: npx ng build --configuration production
        working-directory: src/gameya-web

  e2e:
    name: e2e
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/gameya-web/package-lock.json
      - run: npm ci
        working-directory: src/gameya-web
      - name: Start the stack
        run: |
          docker compose up -d --build --wait
          # The api service has no compose healthcheck (the aspnet image has no curl), so wait on /health from the host.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose logs api
          exit 1
      - name: Start ng serve
        working-directory: src/gameya-web
        run: |
          nohup npx ng serve --host 127.0.0.1 --port 4200 > ng-serve.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:4200 > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "ng serve did not start" >&2
          cat ng-serve.log
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: src/gameya-web
      - run: npx playwright test
        working-directory: src/gameya-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            src/gameya-web/test-results
            src/gameya-web/playwright-report
          if-no-files-found: ignore
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build amd64 image
        run: docker build -f src/Gameya.Api/Dockerfile -t gameya-api:ci .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gameya-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64 image (no push)
        run: >
          docker buildx build --platform linux/arm64
          -f src/Gameya.Api/Dockerfile -t gameya-api:ci-arm64 .
