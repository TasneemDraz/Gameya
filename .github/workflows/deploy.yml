name: Deploy

# push to main -> staging; push of a v* tag -> production (GitHub Environment with a required reviewer).
# Secrets are per GitHub Environment; see docs/deployment.md.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_type == 'tag' && 'production' || 'staging' }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/arm64 API image
        run: |
          docker buildx build --platform linux/arm64 \
            -f src/Gameya.Api/Dockerfile \
            -t "gameya-api:${GITHUB_SHA}" \
            -o type=docker,dest=image.tar .
          gzip -f image.tar

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the self-contained linux-arm64 migrations bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle \
            -p src/Gameya.Infrastructure -s src/Gameya.Infrastructure \
            -r linux-arm64 --self-contained -o efbundle

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/gameya-web/package-lock.json

      - name: Build the web app
        working-directory: src/gameya-web
        run: |
          npm ci
          npx ng build --configuration production

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The host key is pinned in DEPLOY_KNOWN_HOSTS; an unknown or changed key fails the connection.
          {
            echo "Host target"
            echo "  HostName ${DEPLOY_HOST}"
            echo "  User deploy"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload the release
        run: |
          set -euo pipefail
          ssh target "mkdir -p /opt/gameya/caddy /opt/gameya/releases/${GITHUB_SHA}"
          rsync -az --delete src/gameya-web/dist/gameya-web/browser/ "target:/opt/gameya/releases/${GITHUB_SHA}/web/"
          rsync -az efbundle infra/sql/roles.sql "target:/opt/gameya/releases/${GITHUB_SHA}/"
          rsync -az infra/compose.prod.yml infra/deploy-release.sh infra/backup.sh infra/restore.sh target:/opt/gameya/
          rsync -az infra/Caddyfile target:/opt/gameya/caddy/
          ssh target "chmod +x /opt/gameya/*.sh /opt/gameya/releases/${GITHUB_SHA}/efbundle"

      - name: Load the API image
        run: gunzip -c image.tar.gz | ssh target docker load

      - name: Write .env (secrets go over stdin, never on a command line)
        env:
          ASPNETCORE_ENVIRONMENT: ${{ github.ref_type == 'tag' && 'Production' || 'Staging' }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_MIGRATOR_PASSWORD: ${{ secrets.DB_MIGRATOR_PASSWORD }}
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          SECURITY_HASH_KEY: ${{ secrets.SECURITY_HASH_KEY }}
          STORAGE_URL_SIGNING_KEY: ${{ secrets.STORAGE_URL_SIGNING_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          SMSGATE_BASE_URL: ${{ secrets.SMSGATE_BASE_URL }}
          SMSGATE_USERNAME: ${{ secrets.SMSGATE_USERNAME }}
          SMSGATE_PASSWORD: ${{ secrets.SMSGATE_PASSWORD }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          MEDIATR_LICENSE_KEY: ${{ secrets.MEDIATR_LICENSE_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          BACKUP_PING_URL: ${{ secrets.BACKUP_PING_URL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
        run: |
          set -euo pipefail
          # Values are single-quoted (compose reads them literally, so "$" is safe); a quote or newline cannot be.
          # Validation runs in this shell (not a command substitution), so a bad value fails the step before
          # anything is sent over SSH.
          content=""
          bad=0
          for name in ASPNETCORE_ENVIRONMENT SITE_ADDRESS POSTGRES_PASSWORD DB_MIGRATOR_PASSWORD DB_APP_PASSWORD \
            JWT_SIGNING_KEY SECURITY_HASH_KEY STORAGE_URL_SIGNING_KEY SMTP_USERNAME SMTP_PASSWORD EMAIL_FROM \
            SMS_PROVIDER SMSGATE_BASE_URL SMSGATE_USERNAME SMSGATE_PASSWORD SMS_API_KEY MEDIATR_LICENSE_KEY \
            B2_KEY_ID B2_APP_KEY B2_BUCKET BACKUP_PING_URL OTEL_EXPORTER_OTLP_ENDPOINT OTEL_EXPORTER_OTLP_HEADERS; do
            value="${!name-}"
            if [[ "$value" == *"'"* || "$value" == *$'\n'* ]]; then
              echo "::error::secret $name must not contain a single quote or a newline"
              bad=1
              continue
            fi
            content+="$name='$value'"$'\n'
          done
          if ((bad != 0)); then
            exit 1
          fi
          printf '%s\n' "$content" | ssh target 'umask 077; cat > /opt/gameya/.env.new && mv /opt/gameya/.env.new /opt/gameya/.env'

      - name: Deploy
        run: ssh target "/opt/gameya/deploy-release.sh ${GITHUB_SHA}"
