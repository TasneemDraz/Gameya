# Production stack for one Oracle Always Free VM (Ubuntu 24.04 aarch64). Lives in /opt/gameya.
# Run through deploy-release.sh, which passes: --env-file .env --env-file image.env (API_TAG).
# .env is written by the deploy workflow from GitHub Environment secrets; see docs/deployment.md.
name: gameya

x-logging: &json-file-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gameya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gameya"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *json-file-logging

  api:
    image: gameya-api:${API_TAG:?API_TAG is required (image.env)}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__App: Host=postgres;Port=5432;Database=gameya;Username=gameya_app;Password=${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      Jwt__Issuer: gameya
      Jwt__Audience: gameya
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Security__HashKey: ${SECURITY_HASH_KEY:?SECURITY_HASH_KEY is required}
      Storage__RootPath: /data/files
      Storage__UrlSigningKey: ${STORAGE_URL_SIGNING_KEY:?STORAGE_URL_SIGNING_KEY is required}
      Email__Smtp__Host: ${SMTP_HOST:-smtp-relay.brevo.com}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Username: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      Email__Smtp__Password: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      Email__Smtp__UseStartTls: "true"
      Email__From: ${EMAIL_FROM:?EMAIL_FROM is required}
      Sms__Provider: ${SMS_PROVIDER:-SmsGate}
      Sms__SmsGate__BaseUrl: ${SMSGATE_BASE_URL:-https://api.sms-gate.app/3rdparty/v1}
      Sms__SmsGate__Username: ${SMSGATE_USERNAME:-}
      Sms__SmsGate__Password: ${SMSGATE_PASSWORD:-}
      # A paid provider adapter (ProviderSmsSender) is a follow-up task; its key will be passed like this:
      # Sms__ApiKey: ${SMS_API_KEY:-}
      MediatR__LicenseKey: ${MEDIATR_LICENSE_KEY:-}
      App__WebBaseUrl: https://${SITE_ADDRESS:?SITE_ADDRESS is required}
      # Only the compose network may set X-Forwarded-For; keep in sync with networks.default below.
      ForwardedHeaders__KnownNetworks__0: 172.30.0.0/24
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      - files:/data/files
    logging: *json-file-logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./releases:/srv/releases:ro
    logging: *json-file-logging

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
